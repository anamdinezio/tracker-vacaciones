<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de vacaciones</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="encabezado">
    <h1 data-i18n="titulo"></h1>
    <button id="boton-idioma" class="boton-idioma" type="button"></button>
  </header>

  <main>
    <p class="intro" data-i18n="intro"></p>
    <p class="aclaracion" data-i18n="notaPrivacidad"></p>

    <section class="tarjeta">
      <div class="encabezado-tarjeta">
        <h2 id="titulo-resumen"></h2>
        <p class="aclaracion" id="estado-guardado"></p>
      </div>
      <div class="indicadores">
        <div class="indicador">
          <span class="indicador-numero" id="total-dias"></span>
          <span data-i18n="totalDias"></span>
        </div>
        <div class="indicador">
          <span class="indicador-numero" id="dias-usados"></span>
          <span data-i18n="diasUsados"></span>
        </div>
        <div class="indicador indicador-destacado" id="indicador-disponibles">
          <span class="indicador-numero" id="dias-disponibles"></span>
          <span data-i18n="diasDisponibles"></span>
        </div>
      </div>
      <p class="aclaracion" id="nota-sin-periodos" data-i18n="notaSinPeriodos"></p>

      <div id="bloque-dias-por-mes">
        <h3 data-i18n="diasPorMes"></h3>
        <div id="dias-por-mes" class="grafico-meses"></div>
      </div>
    </section>

    <section class="tarjeta">
      <h2 id="titulo-calendario"></h2>
      <div class="leyenda">
        <span><i class="muestra dia-vacaciones"></i> <span data-i18n="leyendaVacaciones"></span></span>
        <span><i class="muestra dia-festivo"></i> <span data-i18n="leyendaFestivo"></span></span>
        <span><i class="muestra dia-no-laborable"></i> <span data-i18n="leyendaNoLaborable"></span></span>
        <span><i class="muestra dia-fuera"></i> <span data-i18n="leyendaFuera"></span></span>
      </div>
      <div id="calendario" class="calendario"></div>
    </section>

    <section class="tarjeta">
      <h2 data-i18n="periodosVacaciones"></h2>

      <form id="form-periodo" class="fila fila-agregar">
        <label class="campo">
          <span data-i18n="desde"></span>
          <input type="date" name="desde">
        </label>
        <label class="campo">
          <span data-i18n="hasta"></span>
          <input type="date" name="hasta">
        </label>
        <button type="submit" class="boton-principal"></button>
        <button type="button" class="boton-secundario boton-cancelar" data-i18n="cancelar" hidden></button>
      </form>
      <p id="error-periodo" class="error"></p>

      <ul id="lista-periodos" class="lista"></ul>
    </section>

    <section class="tarjeta">
      <h2 data-i18n="festivos"></h2>

      <form id="form-festivo" class="fila fila-agregar">
        <label class="campo">
          <span data-i18n="fecha"></span>
          <input type="date" name="fecha">
        </label>
        <label class="campo">
          <span data-i18n="nombreFestivo"></span>
          <input type="text" name="nombre">
        </label>
        <button type="submit" class="boton-principal"></button>
        <button type="button" class="boton-secundario boton-cancelar" data-i18n="cancelar" hidden></button>
      </form>
      <p id="error-festivo" class="error"></p>
      <p class="aclaracion" data-i18n="notaFestivos"></p>

      <ul id="lista-festivos" class="lista"></ul>
    </section>

    <section class="tarjeta">
      <h2 data-i18n="datosEmpleado"></h2>

      <form id="form-empleado">
        <label class="campo">
          <span data-i18n="nombre"></span>
          <input type="text" name="nombre">
        </label>

        <div class="fila">
          <label class="campo">
            <span data-i18n="anio"></span>
            <input type="number" name="anio" min="2000" max="2100">
          </label>
          <label class="campo">
            <span data-i18n="inicioContrato"></span>
            <input type="date" name="inicioContrato">
          </label>
          <label class="campo">
            <span data-i18n="finContrato"></span>
            <input type="date" name="finContrato">
          </label>
        </div>
        <p class="aclaracion" data-i18n="notaContrato"></p>

        <div class="fila">
          <label class="campo">
            <span data-i18n="diasVacaciones"></span>
            <input type="number" name="diasVacaciones" min="0">
          </label>
          <label class="campo">
            <span data-i18n="diasArrastrados"></span>
            <input type="number" name="diasArrastrados" min="0">
          </label>
        </div>

        <!-- Los valores van del 0 (domingo) al 6 (sábado), como cuenta JavaScript. -->
        <fieldset>
          <legend data-i18n="diasQueTrabaja"></legend>
          <div class="opciones">
            <label><input type="checkbox" name="diasLaborables" value="1"> <span data-i18n="lunes"></span></label>
            <label><input type="checkbox" name="diasLaborables" value="2"> <span data-i18n="martes"></span></label>
            <label><input type="checkbox" name="diasLaborables" value="3"> <span data-i18n="miercoles"></span></label>
            <label><input type="checkbox" name="diasLaborables" value="4"> <span data-i18n="jueves"></span></label>
            <label><input type="checkbox" name="diasLaborables" value="5"> <span data-i18n="viernes"></span></label>
            <label><input type="checkbox" name="diasLaborables" value="6"> <span data-i18n="sabado"></span></label>
            <label><input type="checkbox" name="diasLaborables" value="0"> <span data-i18n="domingo"></span></label>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="formaDeContar"></legend>
          <div class="opciones">
            <label><input type="radio" name="formaDeContar" value="laborables"> <span data-i18n="soloLaborables"></span></label>
            <label><input type="radio" name="formaDeContar" value="naturales"> <span data-i18n="diasNaturales"></span></label>
          </div>
        </fieldset>

        <p id="mensaje-error" class="error"></p>
      </form>
    </section>
  </main>

  <footer class="pie">
    <span data-i18n="hechoPor"></span>
    <a href="https://www.linkedin.com/in/ana-di-nezio-perez/" target="_blank" rel="noopener">Ana Di Nezio</a>
  </footer>

  <script src="i18n.js"></script>
  <script src="calendario.js"></script>
  <script src="app.js"></script>
</body>
</html>
